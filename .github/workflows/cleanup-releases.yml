name: Clean up releases (one-off)

# Keeps the tested build as the repository's only release, under a tag of its
# own (the CI's rolling "build-<branch>" tags are replaced on every push), and
# deletes every other release with its tag.
on:
  push:
    branches: [ccr-bc130c02-h72eej]
    paths: ['.github/workflows/cleanup-releases.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Keep one release, delete the rest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: build-ccr-bc130c02-h72eej
          KEEP: galaxy-android-c71feb5
          SHA: c71feb5b28be9fd54c85d909b323bc07954e82ea
        run: |
          set -euo pipefail
          echo "Before:"; gh release list --limit 100
          if ! gh release view "$KEEP" > /dev/null 2>&1; then
            target=$(gh release view "$SOURCE" --json targetCommitish --jq .targetCommitish)
            [ "$target" = "$SHA" ] || { echo "$SOURCE is at $target, not $SHA" >&2; exit 1; }
            gh release download "$SOURCE" --pattern GalaxyAndroid.apk --dir apk
            ls -l apk
            sha256sum apk/GalaxyAndroid.apk
            NOTES="Galaxy Android, built from commit ${SHA}.
          Signed with the CI debug key, not the original author's: Android refuses to install it over a GalaxyMobile from another source. Uninstalling that one deletes its save files (they live in the app's private storage); the game data in /sdcard stays."
            gh release create "$KEEP" --target "$SHA" --latest --title "Galaxy Android (c71feb5)" --notes "$NOTES" apk/GalaxyAndroid.apk
          fi
          gh release view "$KEEP" --json assets --jq '.assets[].name' | grep -qx GalaxyAndroid.apk
          mapfile -t tags < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          for tag in "${tags[@]}"; do
            if [ "$tag" != "$KEEP" ]; then
              gh release delete "$tag" --yes --cleanup-tag < /dev/null
            fi
          done
          echo "After:"; gh release list --limit 100
